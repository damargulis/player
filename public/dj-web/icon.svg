<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89bff"/>
      <stop offset="0.55" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#5e42d6"/>
    </linearGradient>
    <radialGradient id="label" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#b9aeff"/>
      <stop offset="1" stop-color="#6b53e8"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- bigger record: still inside the 80% maskable safe zone (r=204 max) -->
  <circle cx="256" cy="256" r="200" fill="#131318"/>
  <circle cx="256" cy="256" r="200" fill="url(#sheen)"/>
  <!-- fewer, heavier grooves so they survive at 60px -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5">
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="156"/>
    <circle cx="256" cy="256" r="132"/>
  </g>
  <circle cx="256" cy="256" r="84" fill="url(#label)"/>
  <circle cx="256" cy="256" r="17" fill="#131318"/>
</svg>
