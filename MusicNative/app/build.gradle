
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Streaming service details are baked into the build so a fresh install just works, rather
// than making someone type a 43-character token on a phone keyboard after every reinstall.
//
// Values come from an environment variable first (handy for a one-off or CI build), then from
// local.properties, which is gitignored - the token is a credential and this repo is public.
// Missing is fine: the app falls back to the in-app settings screen.
def streamingConfig = { String key, String envName ->
    def fromEnv = System.getenv(envName)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        return (props.getProperty(key) ?: '').trim()
    }
    return ''
}
android {
    namespace 'com.example.musicnative'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.musicnative"
        minSdk 30
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField "String", "STREAMING_URL",
                "\"${streamingConfig('streaming.url', 'STREAMING_URL')}\""
        buildConfigField "String", "STREAMING_TOKEN",
                "\"${streamingConfig('streaming.token', 'STREAMING_TOKEN')}\"" 
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // sideload-signed with the debug keystore; swap in a real keystore for store distribution
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        viewBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.1.1'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.activity:activity-compose:1.3.1'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation 'androidx.compose.material:material:1.1.1'
    implementation "androidx.navigation:navigation-compose:2.5.3"
    implementation "androidx.navigation:navigation-common-ktx:2.5.3"
    implementation ("io.socket:socket.io-client:1.0.0") {
        exclude group: 'org.json', module: 'json'
    }
    implementation "androidx.compose.runtime:runtime-livedata:1.2.0"
    implementation "com.google.android.gms:play-services-cronet:18.0.1"
    implementation "com.android.volley:volley:1.2.1"
    implementation "androidx.media:media:1.3.0-rc02"
    implementation "androidx.work:work-runtime-ktx:2.8.0"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation("io.coil-kt:coil-compose:1.3.1")
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0"
    implementation 'androidx.appcompat:appcompat:1.3.1'


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"\
}